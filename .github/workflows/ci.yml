name: CI

# Both triggers run for a pull request's branch, as right-answers/ci.md
# prescribes, so CI also runs before a PR is opened and on PRs from forks.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: make ci-tools
      - id: setup
        run: make setup
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      # The checks are independent, and make -k runs every lint and test target
      # even after one fails, so one failure doesn't hide another suite.
      - run: make -k lint
      - run: make build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - run: make -k test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DOTFILES_FAIL_ON_SKIP: "1"
