# Programs in a pane, such as Emacs, set the outer terminal's clipboard.
set -g set-clipboard on

set -g extended-keys on

set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"

# allow-passthrough stays off: it would let a program in a pane send escape
# sequences straight to the outer terminal, past tmux.
